description: |
  Progress on the indicators and targets of the 2030 Agenda is assessed on an ongoing basis, and the results of this monitoring are available on the page dedicated to each of the 17 Goals.

  This section provides an overview of the results of that assessment, describing the progress made towards achieving the Sustainable Development Goals in the Autonomous Community of the Basque Country.

  - Goal Progress: the status of each of the 17 Sustainable Development Goals is presented. By selecting a specific Goal, information on the progress of its associated targets and indicators can be accessed.

  - Target Progress: the distribution of the 169 targets of the 2030 Agenda across the different progress categories is presented. A more detailed breakdown by Goal is also available.

  - Indicator Progress: the distribution of indicators across the different progress categories is presented. A more detailed breakdown by Goal is also available

  To learn more about the methodology used to assess progress, see <a href="BASEURL/en/metodologia/">Measuring Progress on the Sustainable Development Goals</a>.

