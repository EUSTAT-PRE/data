definicion:  | 
  Munduko hiritartasunerako hezkuntza (MHH) eta garapen jasangarrirako hezkuntzari (GJH) buruzko UNESCOren 
  galdetegiko 4 ataletako bakoitzean lortutako puntuazioa. Atal bakoitzak 0 eta 1 arteko puntuazio baten bidez 
  neurtzen du Munduko hiritartasunerako hezkuntza eta garapen jasangarrirako hezkuntza zenbateraino 
  barneratzen diren hezkuntza-sistemako alderdi jakin batean: Hezkuntza politiketan, ikasketa-planetan, 
  irakasleen prestakuntzan eta ikasleen ebaluazioan.  

 
formula:  |

  $$P^{t}_{arloa}$$ 

  non: 

  $P^{t}_{arloa} =$ Arlo bakoitzeko galdetegian lortutako puntuazioa $t$ urtean 

  
