definicion: >-
  EAEko administrazio autonomikoaren eta toki administrazioen Garapenerako 
  Laguntza Ofiziala, merkataritzarako laguntzara bideratutakoa (guztizko ordainketa gordina) 

formula: |

  $$GLO_{merkataritza}^{t}$$

  non: 

  $GLO_{merkataritza}^{t} $= merkataritzara bideratutako Garapenerako 
  Laguntza Ofizialaren kopurua $t$ urtean


desagregacion: 

periodicidad: FUENTE.FREQ_A

observaciones: |

  Merkataritza sektoreak, ELGEko Creditor Reporting System-eko (CRS) 210, 220, 231, 232, 233, 
  234, 235, 236, 240, 250, 311, 312, 313, 321, 322, 331 eta 332 serieetako kode guztiak hartzen ditu barne. 


# Metadatos mundiales (Descripción del indicador)  


