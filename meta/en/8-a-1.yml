# Metadatos nacionales (ficha metodológica)
 
indicador_disponible: >-
  GRAFICO.8-a-1-titulo

objetivo_global: objetivo_largo.8-titulo
meta_global: meta_largo.8-a-titulo
#  indicador_onu_global: indicador_largo.8-a-1-titulo


definicion: >-
  Official Development Assistance from the regional and local 
  administrations of the Basque Autonomous Community for aid for trade (total gross disbursement)

  
formula: |

  $$ODA_{trade}^{t}$$

  where: 

  $ODA_{trade}^{t} $= amount of Official Development Assistance for aid for trade in year $t$ 

desagregacion: 

periodicidad: FUENTE.FREQ_A

observaciones: |

  Aid for trade includes al codes in series 210, 220, 231, 232, 233, 
  234, 235, 236, 240, 250, 311, 312, 313, 321, 322, 331 and 332 of the OECD Creditor Reporting System (CRS).


# Metadatos mundiales (Descripción del indicador)  


justificacion_global: |
  
  ODA for aid for trade to developing countries quantify the public effort that donors provide to developing 
  countries for aid for trade.

  Source: United Nations Statistics Division

